name: CodeQL

on:
  schedule:
    - cron: "15 3 23 * *"  # monthly scattered (was: 42 15 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    # scan-fix(actionlint:timeout-minutes on uses): forbidden on uses: jobs — moved inside the reusable workflow
    # GitHub Code Scanning can be enabled/disabled per-repo.
    # Enable explicitly by setting repository variable:
    #   CODEQL_ENABLED=true
    if: vars.CODEQL_ENABLED == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@main
    with:
      languages: "go"
      source-root: "."
