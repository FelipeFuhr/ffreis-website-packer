name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 15 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    timeout-minutes: 30
    # GitHub Code Scanning can be enabled/disabled per-repo.
    # Enable explicitly by setting repository variable:
    #   CODEQL_ENABLED=true
    if: vars.CODEQL_ENABLED == 'true'
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@main
    with:
      languages: "go"
      source-root: "."
