name: Mutation Testing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 14 3 * *"  # monthly scattered (was: 0 2 1 * *)
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    if: ${{ github.event_name != 'pull_request' }}
    # scan-fix(actionlint:timeout-minutes on uses): forbidden on uses: jobs — moved inside the reusable workflow
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mutation.yml@4c3fd318bc57a8f17be0d49047fb869040378a87 # v1.8.0
    with:
      runner: '["ubuntu-latest"]'
      packages: "./internal/..."
      threshold: 60

  mutation-incremental:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mutation.yml@4c3fd318bc57a8f17be0d49047fb869040378a87 # v1.8.0
    with:
      in-diff: true
      runner: '["ubuntu-latest"]'
      threshold: 60

  notify-failure:
    needs: [mutation]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ [CI] ${context.workflow} failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                `**Workflow:** ${context.workflow}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
